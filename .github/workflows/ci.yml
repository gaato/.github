name: CI

# Renovate merges non-major action updates only after a status check passes,
# so without this workflow those pull requests wait for a manual merge. The
# checks cover what a broken change here breaks in every caller: workflow
# syntax and expressions, and the Renovate presets other repositories extend.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      # Unpinned on purpose: the hosted Renovate app runs the newest release,
      # so that is the version whose validation matters.
      - name: Validate Renovate configuration and presets
        run: npx --yes --package renovate -- renovate-config-validator --strict --no-global renovate.json moonbit.json
